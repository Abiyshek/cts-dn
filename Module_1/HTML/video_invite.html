<!DOCTYPE html>
<html>
<head>
    <title>Video Invite with Media Events</title>
</head>
<body style="font-family: Arial; background-color: #f0f0f0; margin: 20px; padding: 20px;">
    <div style="background-color: white; padding: 20px; max-width: 800px; margin: 0 auto;">
        <h1 style="text-align: center; color: #333;">Event Promo Video</h1>
        <p style="text-align: center; color: #666;">Watch our exciting event promotion video</p>
        <div style="margin-bottom: 20px;">
            <video style="width: 100%; height: auto;" controls>
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <p style="text-align: center; color: #28a745; font-weight: bold;">Video ready to play</p>
        <form style="background-color: #f9f9f9; padding: 20px; border: 1px solid #ddd;">
            <h2 style="color: #333;">Event Registration</h2>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: #555; font-weight: bold;">Full Name:</label>
                <input type="text" placeholder="Enter your full name" style="width: 100%; padding: 8px; border: 1px solid #ddd;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: #555; font-weight: bold;">Email:</label>
                <input type="email" placeholder="Enter your email address" style="width: 100%; padding: 8px; border: 1px solid #ddd;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="color: #555;">
                    <input type="checkbox" style="margin-right: 5px;">
                    Yes, I'm interested in attending this event
                </label>
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: #555; font-weight: bold;">Comments:</label>
                <textarea placeholder="Share your thoughts about the event..." style="width: 100%; padding: 8px; border: 1px solid #ddd; min-height: 80px;"></textarea>
            </div>
            <button type="submit" style="background-color: #007bff; color: white; padding: 10px 20px; border: none;">Register for Event</button>
        </form>
    </div>
</body>
</html>
